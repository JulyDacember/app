[project]
name = "gbr_server"
version = "0.1.0"
description = "Backend server for GBR app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic-settings==2.5.2",
  "sqlalchemy==2.0.34",
  "asyncpg==0.29.0",
  "alembic==1.13.2",
  "psycopg[binary]==3.2.10",
  "python-dotenv==1.0.1",
  "passlib[bcrypt]==1.7.4",
  "pyjwt==2.9.0",
  "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.6.8",
  "pytest==8.3.3",
  "httpx==0.27.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"